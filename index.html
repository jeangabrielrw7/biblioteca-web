<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Autenticação</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }

        .brand {
            text-align: center;
            margin-bottom: 3rem;
        }

        .brand h1 {
            color: var(--primary);
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.5px;
        }

        .brand p {
            color: var(--text-light);
            margin: 0;
            font-size: 1.1rem;
        }

        .forms-wrapper {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }

        form {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            color: var(--text);
        }

        input, select {
            padding: 0.85rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            background-color: #f9fafb;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        button {
            background: var(--primary);
            color: white;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="brand">
        <h1>Scriptorium</h1>
        <p>Sistema de Gerenciamento de Biblioteca</p>
    </div>

    <div class="forms-wrapper">
        <form id="loginForm">
            <h3>Acessar Conta</h3>
            <input type="email" id="logEmail" placeholder="Seu email" required>
            <input type="password" id="logSenha" placeholder="Sua senha" required>
            <button type="submit">Entrar</button>
        </form>

        <form id="regForm">
            <h3>Criar Conta</h3>
            <input type="text" id="regNome" placeholder="Nome completo" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regSenha" placeholder="Senha" required>
            <select id="regPerfil" required>
                <option value="bibliotecario">Bibliotecário</option>
                <option value="leitor">Leitor</option>
            </select>
            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('logEmail').value;
            const senha = document.getElementById('logSenha').value;
            const res = await fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('user', JSON.stringify(data));
                window.location.href = data.perfil === 'bibliotecario' ? 'bibliotecario.html' : 'leitor.html';
            } else {
                alert(data.error);
            }
        });

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('regNome').value;
            const email = document.getElementById('regEmail').value;
            const senha = document.getElementById('regSenha').value;
            const perfil = document.getElementById('regPerfil').value;
            const res = await fetch('http://localhost:3000/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha, perfil })
            });
            if (res.ok) {
                alert('Usuário cadastrado com sucesso!');
                document.getElementById('regForm').reset();
            } else {
                const data = await res.json();
                alert('Erro ao registrar: ' + data.error);
            }
        });
    </script>
</body>
</html>
